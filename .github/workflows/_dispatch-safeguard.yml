name: dispatch safeguard-killer release

# 临时工作流：本机没有 gh 凭据，改用仓库内置 GITHUB_TOKEN 触发 build.yml 的
# workflow_dispatch（需要 allow_partial=true 才能跳过 macOS runner 偶发被取消的
# darwin/arm64 作业）。发布完成后本文件与触发文件一并删除。
on:
  push:
    paths:
      - ".github/dispatch/safeguard-killer-0.1.13"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger build.yml workflow_dispatch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const res = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              ref: 'main',
              inputs: {
                plugin: 'safeguard-killer',
                version: '0.1.13',
                allow_partial: 'true'
              }
            });
            core.info(`dispatch status ${res.status}`);