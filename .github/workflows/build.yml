# Multi-arch CPA plugin build & release (4 plugins under cpa-workbuddy-plugin).
# Plugin sources live in <src>/ (workbuddy/, qoderwork/, token-usage-tracker/,
# traework/);
# plugin identity (`id`) is the cpa-facing plugin id and may differ from the
# source directory name (binary filename = <id>.<so|dylib|dll>, zip filename =
# <id>_<version>_<goos>_<goarch>.zip).
#
# Each plugin versions INDEPENDENTLY:
#   - tag 'workbuddy-provider-v*'           → release workbuddy-provider at that version
#   - tag 'qoderwork-provider-v*'           → release qoderwork-provider at that version
#   - tag 'workbuddy-token-usage-v*'        → release workbuddy-token-usage at that version
#   - tag 'traework-provider-v*'            → release traework-provider at that version
#   - tag 'cursor-provider-v*'              → release cursor-provider at that version
#   - tag 'copilot-provider-v*'             → release copilot-provider at that version
#   - tag 'coze-provider-v*'                → release coze-provider at that version
#   - tag 'qwenwork-provider-v*'            → release qwenwork-provider at that version
#   - tag 'safeguard-killer-v*'             → release safeguard-killer at that version
#   - tag 'doubao-provider-v*'               → release doubao-provider at that version
#   - workflow_dispatch                       → pick plugin + version manually
#   - plain push/PR                          → CI builds for all (artifacts only, no release)
#
# Asset naming matches CLIProxyAPI pluginstore ArchiveName():
#   <id>_<version>_<goos>_<goarch>.zip     (zip root: <id>.so|.dylib|.dll)

name: Build

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "doc/**"
      - "skills/**"
      - "release-assets/**"
      - "**/*.md"
    tags:
      - "workbuddy-provider-v*"
      - "qoderwork-provider-v*"
      - "workbuddy-token-usage-v*"
      - "traework-provider-v*"
      - "workbuddy-ai-provider-v*"
      - "cursor-provider-v*"
      - "qoder-ai-provider-v*"
      - "zcode-provider-v*"
      - "copilot-provider-v*"
      - "coze-provider-v*"
      - "qwenwork-provider-v*"
      - "safeguard-killer-v*"
      - "doubao-provider-v*"
  workflow_dispatch:
    inputs:
      plugin:
        description: "Plugin to release"
        required: true
        type: choice
        options: [workbuddy-provider, qoderwork-provider, workbuddy-token-usage, traework-provider, workbuddy-ai-provider, cursor-provider, qoder-ai-provider, zcode-provider, copilot-provider, coze-provider, qwenwork-provider, safeguard-killer, doubao-provider]
      version:
        description: "Version without v (empty = plugin's VERSION file)"
        required: false
        default: ""
      allow_partial:
        description: "Release even when some platform builds failed (missing platforms are dropped from assets/registry)"
        required: false
        type: boolean
        default: false

concurrency:
  # Push runs cancel each other, but they must never cancel a dispatch/tag
  # release: a mid-flight release cancelled by an unrelated push would leave a
  # partially uploaded GitHub Release. Including the event and the target
  # plugin keeps release groups isolated from ordinary branch pushes.
  group: build-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.inputs.plugin }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.dir }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: workbuddy
          - dir: qoderwork
          - dir: token-usage-tracker
          - dir: traework
          - dir: workbuddy-ai
          - dir: cursor
          - dir: qoder-ai
          - dir: zcode
          - dir: copilot
          - dir: coze
          - dir: qwenwork
          - dir: safeguard-killer
          - dir: doubao
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache-dependency-path: ${{ matrix.dir }}/go.sum
      - name: Validate registry.json
        working-directory: .
        run: python3 scripts/validate-registry.py registry.json
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  prepare:
    name: Prepare matrix
    # Runs in parallel with the test matrix so dispatch/tag runs do not pay an
    # extra serialization hop before the builds start.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.matrix.outputs.native }}
      cross: ${{ steps.matrix.outputs.cross }}
    steps:
      - name: Resolve target plugin and build matrices
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PLUGIN: ${{ github.event.inputs.plugin }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          # Plugin id -> source directory. Every plugin shares the same five
          # native targets plus one windows-arm64 cross target, so the matrix is
          # derived from the target plugin instead of being hardcoded 60+12 times.
          PLUGINS = {
              "workbuddy-provider": "workbuddy",
              "qoderwork-provider": "qoderwork",
              "workbuddy-token-usage": "token-usage-tracker",
              "traework-provider": "traework",
              "workbuddy-ai-provider": "workbuddy-ai",
              "cursor-provider": "cursor",
              "qoder-ai-provider": "qoder-ai",
              "zcode-provider": "zcode",
              "copilot-provider": "copilot",
              "coze-provider": "coze",
              "qwenwork-provider": "qwenwork",
              # 源码目录名与 plugin id 同名（上游 safeguard-killer 原样 vendor）。
              "safeguard-killer": "safeguard-killer",
              "doubao-provider": "doubao",
          }
          NATIVE = [
              ("linux", "amd64", "ubuntu-24.04", "so"),
              ("linux", "arm64", "ubuntu-24.04-arm", "so"),
              ("darwin", "amd64", "macos-15-intel", "dylib"),
              # arm64 用 macos-14：macos-15 标签的运行器池近两轮排队 15 分钟仍拿不到
              # runner（runner_id=0 后被系统取消），而 macos-14 同为 Apple Silicon
              # 架构、镜像稳定。构建产物同为 arm64 dylib，只是镜像版本不同。
              ("darwin", "arm64", "macos-14", "dylib"),
              ("windows", "amd64", "windows-2025", "dll"),
          ]

          def resolve_plugin():
              if os.environ["EVENT_NAME"] == "workflow_dispatch":
                  return os.environ["INPUT_PLUGIN"]
              # Tag name is <plugin-id>-v<version>; longest id wins in case one
              # id is a prefix of another.
              ref = os.environ["REF_NAME"]
              matches = [pid for pid in PLUGINS if ref.startswith(pid + "-v")]
              return max(matches, key=len) if matches else ""

          plugin = resolve_plugin()
          if plugin not in PLUGINS:
              sys.exit(
                  "无法解析目标插件："
                  f"event={os.environ['EVENT_NAME']} "
                  f"ref={os.environ['REF_NAME']} "
                  f"input={os.environ['INPUT_PLUGIN']!r}"
              )

          src = PLUGINS[plugin]
          native = [
              {"id": plugin, "src": src, "goos": goos, "goarch": goarch, "runner": runner, "ext": ext}
              for goos, goarch, runner, ext in NATIVE
          ]
          cross = [{"id": plugin, "src": src, "target": "windows-arm64", "ext": "dll"}]
          if not native or not cross:
              sys.exit(f"目标插件 {plugin} 的构建矩阵为空")

          print(f"target plugin: {plugin} (src={src})")
          print(f"native jobs: {len(native)}, cross jobs: {len(cross)}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"native={json.dumps({'include': native})}\n")
              fh.write(f"cross={json.dumps({'include': cross})}\n")
          PY

  build:
    name: ${{ matrix.id }} ${{ matrix.goos }}/${{ matrix.goarch }}
    # Branch pushes and PRs only run the test matrix; builds are reserved for
    # dispatch and tag releases.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: [test, prepare]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.native) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.src }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.src }}/go.mod
          cache-dependency-path: ${{ matrix.src }}/go.sum

      - name: Resolve release metadata
        working-directory: .
        run: |
          set -euo pipefail
          PLUGIN="${{ matrix.id }}"
          SRC="${{ matrix.src }}"
          # Version resolution: tag of this plugin > dispatch input > VERSION file
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" == ${PLUGIN}-v* ]]; then
            VERSION="${GITHUB_REF_NAME#${PLUGIN}-v}"
          elif [ -n "${{ github.event.inputs.version }}" ] && [ "${{ github.event.inputs.plugin }}" == "${PLUGIN}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="$(tr -d ' \n\r' < ${SRC}/VERSION)"
            # CI builds (non-release) get a +ci suffix to avoid clashing with real versions
            if [[ "${GITHUB_REF_TYPE:-}" != "tag" && "${{ github.event_name }}" != "workflow_dispatch" ]]; then
              VERSION="${VERSION}+ci.${GITHUB_RUN_NUMBER}"
            fi
          fi
          CLEAN_VERSION="${VERSION%%+*}"
          echo "VERSION=${CLEAN_VERSION}" >> "${GITHUB_ENV}"
          echo "LIB_NAME=${PLUGIN}.${{ matrix.ext }}" >> "${GITHUB_ENV}"
          echo "ARCHIVE_NAME=${PLUGIN}_${CLEAN_VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" >> "${GITHUB_ENV}"
          echo "version=${CLEAN_VERSION} archive=${PLUGIN}_${CLEAN_VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"

      - name: Build shared library
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -buildmode=c-shared \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${LIB_NAME}" .
          rm -f "dist/${{ matrix.id }}.h" dist/*.h || true
          file "dist/${LIB_NAME}" || true

      - name: Package plugin (CPA ArchiveName)
        working-directory: .
        run: |
          set -euo pipefail
          go run ./.github/scripts/package-release.go \
            -library "${{ matrix.src }}/dist/${LIB_NAME}" \
            -archive "${ARCHIVE_NAME}" \
            -checksum "${ARCHIVE_NAME}.sha256"
          python3 - <<'PY'
          import zipfile, os, sys
          name = os.environ["ARCHIVE_NAME"]
          lib = os.environ["LIB_NAME"]
          with zipfile.ZipFile(name) as z:
              names = z.namelist()
              print("zip entries:", names)
              if lib not in names:
                  sys.exit(f"zip root missing {lib}: {names}")
          PY

      - name: Upload build artifact
        id: upload_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

      # 2026-09-08: GitHub artifact blob storage had a window of intermittent
      # failures ("Upload build artifact" failing on random matrix jobs while
      # every build/test step stayed green). One retry with overwrite covers
      # the transient case; a second failure still fails the job loudly.
      - name: Retry upload build artifact
        if: steps.upload_artifact.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error
          overwrite: true

  build-cross:
    name: ${{ matrix.id }} ${{ matrix.target }} (go-cross)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: [test, prepare]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.cross) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.src }}/go.mod
          cache-dependency-path: ${{ matrix.src }}/go.sum

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          PLUGIN="${{ matrix.id }}"
          SRC="${{ matrix.src }}"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" == ${PLUGIN}-v* ]]; then
            VERSION="${GITHUB_REF_NAME#${PLUGIN}-v}"
          elif [ -n "${{ github.event.inputs.version }}" ] && [ "${{ github.event.inputs.plugin }}" == "${PLUGIN}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="$(tr -d ' \n\r' < ${SRC}/VERSION)"
          fi
          CLEAN_VERSION="${VERSION%%+*}"
          GOOS_PART="${{ matrix.target }}"
          echo "VERSION=${CLEAN_VERSION}" >> "${GITHUB_ENV}"
          echo "version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "ARCHIVE_NAME=${PLUGIN}_${CLEAN_VERSION}_${GOOS_PART%-*}_${GOOS_PART#*-}.zip" >> "${GITHUB_ENV}"
          echo "LIB_NAME=${PLUGIN}.${{ matrix.ext }}" >> "${GITHUB_ENV}"

      - name: Build cross shared library
        timeout-minutes: 45
        uses: go-cross/cgo-actions@v1
        env:
          GOFLAGS: -trimpath -buildmode=c-shared
        with:
          dir: ${{ matrix.src }}
          packages: .
          targets: ${{ matrix.target }}
          out-dir: dist/${{ matrix.target }}
          output: ${{ env.LIB_NAME }}
          flags: -ldflags=-s -w
          x-flags: main.version=${{ steps.meta.outputs.version }}

      - name: Package plugin
        run: |
          set -euo pipefail
          rm -f go-cross-bin.h "${{ matrix.src }}/dist/${{ matrix.target }}/${{ matrix.id }}.h" || true
          LIB=""
          for p in \
            "${{ matrix.src }}/dist/${{ matrix.target }}/${LIB_NAME}" \
            "dist/${{ matrix.target }}/${LIB_NAME}" \
            "${{ matrix.src }}/dist/${LIB_NAME}"; do
            if [ -f "$p" ]; then LIB="$p"; break; fi
          done
          if [ -z "$LIB" ]; then
            echo "library not found"; find . -name '*.dll' -o -name '*.so' | head
            exit 1
          fi
          go run ./.github/scripts/package-release.go \
            -library "${LIB}" \
            -archive "${ARCHIVE_NAME}" \
            -checksum "${ARCHIVE_NAME}.sha256"

      - name: Upload build artifact
        id: upload_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

      # 2026-09-08: GitHub artifact blob storage had a window of intermittent
      # failures ("Upload build artifact" failing on random matrix jobs while
      # every build/test step stayed green). One retry with overwrite covers
      # the transient case; a second failure still fails the job loudly.
      - name: Retry upload build artifact
        if: steps.upload_artifact.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error
          overwrite: true

  release:
    name: Release
    # Only for a tag of a specific plugin, or dispatch with a version.
    if: >-
      always() &&
      needs.test.result == 'success' &&
      needs.prepare.result == 'success' &&
      (
        (github.event.inputs.allow_partial == 'true' &&
          needs.build.result != 'skipped' &&
          needs.build-cross.result != 'skipped') ||
        (needs.build.result == 'success' && needs.build-cross.result == 'success')
      ) &&
      (
      (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '') ||
      startsWith(github.ref, 'refs/tags/workbuddy-provider-v') ||
      startsWith(github.ref, 'refs/tags/qoderwork-provider-v') ||
      startsWith(github.ref, 'refs/tags/workbuddy-token-usage-v') ||
        startsWith(github.ref, 'refs/tags/traework-provider-v') ||
        startsWith(github.ref, 'refs/tags/workbuddy-ai-provider-v') ||
        startsWith(github.ref, 'refs/tags/cursor-provider-v') ||
        startsWith(github.ref, 'refs/tags/qoder-ai-provider-v') ||
        startsWith(github.ref, 'refs/tags/zcode-provider-v') ||
        startsWith(github.ref, 'refs/tags/copilot-provider-v') ||
        startsWith(github.ref, 'refs/tags/coze-provider-v') ||
        startsWith(github.ref, 'refs/tags/qwenwork-provider-v') ||
        startsWith(github.ref, 'refs/tags/safeguard-killer-v') ||
        startsWith(github.ref, 'refs/tags/doubao-provider-v')
      )
    needs:
      - test
      - prepare
      - build
      - build-cross
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve plugin + version
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            P="${{ github.event.inputs.plugin }}"
            V="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF_NAME}" == workbuddy-provider-v* ]]; then
            P="workbuddy-provider"; V="${GITHUB_REF_NAME#workbuddy-provider-v}"
          elif [[ "${GITHUB_REF_NAME}" == qoderwork-provider-v* ]]; then
            P="qoderwork-provider"; V="${GITHUB_REF_NAME#qoderwork-provider-v}"
          elif [[ "${GITHUB_REF_NAME}" == traework-provider-v* ]]; then
            P="traework-provider"; V="${GITHUB_REF_NAME#traework-provider-v}"
          elif [[ "${GITHUB_REF_NAME}" == workbuddy-ai-provider-v* ]]; then
            P="workbuddy-ai-provider"; V="${GITHUB_REF_NAME#workbuddy-ai-provider-v}"
          elif [[ "${GITHUB_REF_NAME}" == cursor-provider-v* ]]; then
            P="cursor-provider"; V="${GITHUB_REF_NAME#cursor-provider-v}"
          elif [[ "${GITHUB_REF_NAME}" == qoder-ai-provider-v* ]]; then
            P="qoder-ai-provider"; V="${GITHUB_REF_NAME#qoder-ai-provider-v}"
          elif [[ "${GITHUB_REF_NAME}" == zcode-provider-v* ]]; then
            P="zcode-provider"; V="${GITHUB_REF_NAME#zcode-provider-v}"
          elif [[ "${GITHUB_REF_NAME}" == copilot-provider-v* ]]; then
            P="copilot-provider"; V="${GITHUB_REF_NAME#copilot-provider-v}"
          elif [[ "${GITHUB_REF_NAME}" == coze-provider-v* ]]; then
            P="coze-provider"; V="${GITHUB_REF_NAME#coze-provider-v}"
          elif [[ "${GITHUB_REF_NAME}" == qwenwork-provider-v* ]]; then
            P="qwenwork-provider"; V="${GITHUB_REF_NAME#qwenwork-provider-v}"
          elif [[ "${GITHUB_REF_NAME}" == safeguard-killer-v* ]]; then
            P="safeguard-killer"; V="${GITHUB_REF_NAME#safeguard-killer-v}"
          elif [[ "${GITHUB_REF_NAME}" == doubao-provider-v* ]]; then
            P="doubao-provider"; V="${GITHUB_REF_NAME#doubao-provider-v}"
          else
            P="workbuddy-token-usage"; V="${GITHUB_REF_NAME#workbuddy-token-usage-v}"
          fi
          echo "plugin=$P" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=${P}-v${V}" >> "$GITHUB_OUTPUT"
          echo "Releasing $P v$V"

      - name: Download build artifacts
        id: download_artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Retry download build artifacts
        if: steps.download_artifacts.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assemble checksums.txt (this plugin only)
        env:
          PLUGIN: ${{ steps.meta.outputs.plugin }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          mv dist/${PLUGIN}_${VERSION}_*.zip* out/ 2>/dev/null || true
          ls -la out/
          if ls out/*.sha256 >/dev/null 2>&1; then
            sort out/*.sha256 > out/checksums.txt
          else
            (cd out && sha256sum *.zip > checksums.txt)
          fi
          cat out/checksums.txt
          MISSING=""
          for t in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64 windows_arm64; do
            test -f "out/${PLUGIN}_${VERSION}_${t}.zip" || MISSING="${MISSING} ${t}"
          done
          if [ -n "${MISSING}" ]; then
            if [ "${{ github.event.inputs.allow_partial }}" = "true" ]; then
              echo "WARN partial release: missing${MISSING} (allow_partial=true)"
            else
              echo "missing platform artifacts:${MISSING}"; exit 1
            fi
          fi

      - name: Sync registry.json version (this plugin only)
        env:
          PLUGIN: ${{ steps.meta.outputs.plugin }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          pid, v = os.environ["PLUGIN"], os.environ["VERSION"]
          p = pathlib.Path("registry.json")
          data = json.loads(p.read_text())
          for plug in data.get("plugins", []):
              if plug.get("id") == pid:
                  plug["version"] = v
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          print(p.read_text())
          PY
          python3 scripts/validate-registry.py registry.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          PLUGIN: ${{ steps.meta.outputs.plugin }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Display name mapping so the GitHub Release title uses the human-readable
          # plugin display name (e.g. "WorkBuddy Provider") rather than the cpa id
          # ("workbuddy-provider"). Kept here because it's only consumed by gh
          # release's --title flag and never re-used in the plugin binary.
          DISPLAY=""
          case "${PLUGIN}" in
            workbuddy-provider)    DISPLAY="WorkBuddy Provider" ;;
            qoderwork-provider)    DISPLAY="QoderWork Provider" ;;
            workbuddy-token-usage) DISPLAY="WorkBuddy Token Usage" ;;
            traework-provider)     DISPLAY="TraeWork Provider" ;;
            workbuddy-ai-provider) DISPLAY="WorkBuddy AI" ;;
            cursor-provider)       DISPLAY="Cursor Provider" ;;
            qoder-ai-provider)     DISPLAY="Qoder AI" ;;
            zcode-provider)        DISPLAY="ZCode Provider" ;;
            copilot-provider)      DISPLAY="GitHub Copilot" ;;
            coze-provider)         DISPLAY="Coze Provider" ;;
            qwenwork-provider)     DISPLAY="QwenWork Provider" ;;
            safeguard-killer)      DISPLAY="Safeguard Killer" ;;
            doubao-provider)       DISPLAY="Doubao Provider" ;;
          esac
          TITLE="${DISPLAY:-$PLUGIN} v${VERSION}"
          # tag 由 gh release create 自动创建（指向当前提交）。
          # 不在这里 git tag + git push：默认 GITHUB_TOKEN 没有 workflows 权限，
          # 只要当前提交改过 .github/workflows/ 就会 push 被拒
          # （refusing to allow a GitHub App to create or update workflow ...）。
          # 已有 release 时走 upload 分支，同样不需要手动建 tag。
          NOTES=$(cat <<EOF
          ## ${DISPLAY:-$PLUGIN} CPA plugin v${VERSION}

          Multi-arch builds for [CLIProxyAPI](https://github.com/router-for-me/CLIProxyAPI) plugin store (\`github-release\` install type).

          Plugin id: \`${PLUGIN}\`

          ### Assets (pluginstore \`ArchiveName(id, version, goos, goarch)\`)
          | File | Contents |
          |---|---|
          | \`${PLUGIN}_${VERSION}_linux_amd64.zip\` | \`${PLUGIN}.so\` |
