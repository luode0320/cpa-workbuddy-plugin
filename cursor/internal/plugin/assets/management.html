<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Cursor 插件状态、本地估算用量与模型禁用管理。">
  <title>Cursor 管理</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f5f7fa;
      --surface: #ffffff;
      --surface-muted: #f0f3f7;
      --text: #17202a;
      --muted: #657080;
      --border: #d8dee8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-contrast: #ffffff;
      --success: #18794e;
      --warning: #9a6700;
      --danger: #b42318;
      --focus: #1d4ed8;
      --shadow: 0 8px 24px rgba(23, 32, 42, .08);
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --space-16: 64px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-pill: 999px;
      --border-width: 1px;
      --control-size: 44px;
      --font-xs: 13px;
      --font-lg: 18px;
      --font-section: 20px;
      --font-title-min: 28px;
      --font-title-max: 40px;
      --weight-label: 650;
      --weight-action: 700;
      --content-width: 960px;
      --model-cell-width: 220px;
      --model-list-height: 360px;
      --focus-width: 3px;
      --focus-offset: 2px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --canvas: #0f141b;
      --surface: #171e27;
      --surface-muted: #202936;
      --text: #edf2f7;
      --muted: #a9b4c2;
      --border: #344150;
      --accent: #6ea8fe;
      --accent-hover: #8abbff;
      --accent-contrast: #08111f;
      --success: #63d6a2;
      --warning: #f5c451;
      --danger: #ff8a80;
      --focus: #93c5fd;
      --shadow: 0 8px 24px rgba(0, 0, 0, .28);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--text); line-height: 1.55; }
    main { width: min(var(--content-width), calc(100% - var(--space-8))); margin: 0 auto; padding: var(--space-8) 0 var(--space-16); }
    h1, h2, h3 { margin: 0; letter-spacing: -.02em; }
    h1 { font-size: clamp(var(--font-title-min), 5vw, var(--font-title-max)); line-height: 1.15; }
    h2 { font-size: var(--font-section); }
    h3 { font-size: var(--font-lg); }
    p { margin: var(--space-2) 0 0; }
    .muted { color: var(--muted); }
    .stack { display: grid; gap: var(--space-4); }
    .header { margin-bottom: var(--space-6); }
    .header-row { display: flex; justify-content: space-between; gap: var(--space-4); align-items: start; }
    .language-field { display: grid; gap: var(--space-1); min-width: 132px; }
    .language-field label { color: var(--muted); font-size: var(--font-xs); }
    .panel { padding: var(--space-6); border: var(--border-width) solid var(--border); border-radius: var(--radius-md); background: var(--surface); }
    .credential-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-3); align-items: start; }
    .load-action { padding-top: var(--space-8); }
    .nowrap { white-space: nowrap; }
    label, legend { font-weight: var(--weight-label); }
    select { min-height: var(--control-size); padding: var(--space-2) var(--space-3); color: var(--text); background: var(--surface); border: var(--border-width) solid var(--border); border-radius: var(--radius-sm); font: inherit; }
    input[type="password"] { width: 100%; min-height: var(--control-size); margin-top: var(--space-2); padding: var(--space-2) var(--space-3); color: var(--text); background: var(--surface-muted); border: var(--border-width) solid var(--border); border-radius: var(--radius-sm); font: inherit; }
    button { min-height: var(--control-size); padding: var(--space-2) var(--space-4); border: var(--border-width) solid transparent; border-radius: var(--radius-sm); font: inherit; font-weight: var(--weight-action); cursor: pointer; }
    button.primary { color: var(--accent-contrast); background: var(--accent); }
    button.primary:hover { background: var(--accent-hover); }
    button.secondary { color: var(--text); background: var(--surface-muted); border-color: var(--border); }
    button:disabled { cursor: wait; opacity: .62; }
    button:focus-visible, input:focus-visible, select:focus-visible, .model:focus-within { outline: var(--focus-width) solid var(--focus); outline-offset: var(--focus-offset); }
    .notice { min-height: var(--space-6); margin-top: var(--space-3); color: var(--muted); }
    .notice.error { color: var(--danger); }
    .notice.success { color: var(--success); }
    .account { box-shadow: var(--shadow); }
    .account-head { display: flex; justify-content: space-between; gap: var(--space-3); align-items: start; }
    .pill { display: inline-flex; align-self: start; width: max-content; padding: var(--space-1) var(--space-2); color: var(--success); background: var(--surface-muted); border-radius: var(--radius-pill); font-size: var(--font-xs); font-weight: var(--weight-action); }
    .pill[data-status="error"], .pill[data-status="unavailable"] { color: var(--danger); }
    .pill[data-status="disabled"], .pill[data-status="inactive"] { color: var(--muted); }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-2); margin-top: var(--space-4); }

    .metric-section { margin-top: var(--space-6); }
    .metric { padding: var(--space-3); border-radius: var(--radius-sm); background: var(--surface-muted); }
    .metric span { display: block; color: var(--muted); font-size: var(--font-xs); }
    .metric strong { display: block; margin-top: var(--space-1); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: var(--font-lg); }
    fieldset { min-width: 0; margin: var(--space-6) 0 0; padding: 0; border: 0; }
    .models { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(var(--model-cell-width), 100%), 1fr)); gap: var(--space-2); margin-top: var(--space-3); max-height: var(--model-list-height); overflow: auto; }
    .model { display: flex; gap: var(--space-3); align-items: start; min-height: var(--control-size); padding: var(--space-3); border: var(--border-width) solid var(--border); border-radius: var(--radius-sm); background: var(--surface-muted); }
    .model input { margin-top: var(--space-1); }
    .model code { min-width: 0; overflow-wrap: normal; word-break: normal; font-size: var(--font-xs); }
    .account-notice { margin-bottom: 0; text-align: right; }
    .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-4); }
    .empty { padding: var(--space-6); text-align: center; color: var(--muted); }
    @media (max-width: 720px) {
      main { width: min(100% - var(--space-6), var(--content-width)); padding-top: var(--space-6); }
      .credential-grid, .metrics { grid-template-columns: 1fr; }
      .load-action { padding-top: 0; }
      .credential-grid button { width: 100%; }
      .header-row, .account-head { display: grid; }
      .language-field { width: 100%; }
      .models { max-height: none; overflow: visible; }
      .account-notice { text-align: left; }
      .actions button { width: 100%; }
    }
    .bar { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-4); }
    .modal-mask { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; padding: var(--space-4); background: rgba(15, 20, 27, .55); }
    .modal-mask.show { display: flex; }
    .modal { width: min(560px, 100%); max-height: 86vh; overflow: auto; background: var(--surface); border: var(--border-width) solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow); }
    .modal-hd, .modal-ft { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-4) var(--space-6); }
    .modal-hd { justify-content: space-between; border-bottom: var(--border-width) solid var(--border); }
    .modal-ft { justify-content: flex-end; border-top: var(--border-width) solid var(--border); }
    .modal-bd { display: grid; gap: var(--space-3); padding: var(--space-6); }
    .modal-x { min-height: auto; padding: var(--space-1) var(--space-2); color: var(--muted); background: transparent; font-size: var(--font-lg); }
    textarea { width: 100%; min-height: 132px; padding: var(--space-3); color: var(--text); background: var(--surface-muted); border: var(--border-width) solid var(--border); border-radius: var(--radius-sm); font: inherit; resize: vertical; }
    .hint { color: var(--muted); font-size: var(--font-xs); }
    .file-row { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
    .file-info { color: var(--muted); font-size: var(--font-xs); }
    .file-info.bad { color: var(--danger); }
    .file-list { display: none; gap: var(--space-1); }
    .file-list.show { display: grid; }
    .file-item, .r-item { display: flex; justify-content: space-between; gap: var(--space-2); font-size: var(--font-xs); }
    .import-result { display: none; }
    .import-result.show { display: grid; gap: var(--space-1); }
    .r-hd { font-size: var(--font-xs); font-weight: var(--weight-label); }
    .r-hd.err { color: var(--danger); }
    .r-err { color: var(--danger); }
    .toasts { position: fixed; top: var(--space-4); right: var(--space-4); z-index: 60; display: grid; gap: var(--space-2); max-width: min(360px, calc(100% - var(--space-8))); }
    .toast { padding: var(--space-3) var(--space-4); border: var(--border-width) solid var(--border); border-left: 4px solid var(--accent); border-radius: var(--radius-sm); background: var(--surface); box-shadow: var(--shadow); opacity: 0; transform: translateY(-6px); transition: opacity .18s ease, transform .18s ease; cursor: pointer; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.ok { border-left-color: var(--success); }
    .toast.warn { border-left-color: var(--warning); }
    .toast.err { border-left-color: var(--danger); }
    .toast .t { font-weight: var(--weight-label); }
    .toast .d { margin-top: var(--space-1); color: var(--muted); font-size: var(--font-xs); word-break: break-word; }
    .spin { display: inline-block; width: 12px; height: 12px; margin-right: var(--space-1); border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .card-del { min-height: auto; padding: 0 var(--space-2); color: var(--muted); background: transparent; font-size: var(--font-lg); }
    .card-del:hover { color: var(--danger); }
    .header-title { display: flex; align-items: center; gap: var(--space-3); }
    .header-logo { width: 36px; height: 36px; border-radius: var(--radius-sm); object-fit: contain; background: #000; display: block; }
    .model-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: var(--space-2); margin-top: var(--space-3); max-height: 240px; overflow-y: auto; }
    .model-item { font-family: ui-monospace, monospace; font-size: var(--font-xs); padding: var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); cursor: pointer; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: all .15s ease; }
    .model-item:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--surface-muted); }
    .model-item:disabled { opacity: .5; cursor: not-allowed; }
    .import-result { margin-top: var(--space-3); padding: var(--space-3); border-radius: var(--radius-sm); font-size: var(--font-xs); background: var(--surface-muted); border: 1px solid var(--border); display: none; }
    .import-result.show { display: block; }
    .r-hd { font-weight: 600; margin-bottom: var(--space-1); }
    .r-hd.ok { color: var(--success); }
    .r-hd.err { color: var(--danger); }
    .r-item { display: flex; justify-content: space-between; gap: var(--space-2); word-break: break-all; }
    .r-err { color: var(--danger); }
  </style>
  <script>
    /* 主题同步：嵌入主面板时镜像 data-theme，独立打开时跟随系统深浅色。 */
    (() => {
      const ATTR = "data-theme";
      const embedded = () => { try { return window.self !== window.top; } catch (_) { return false; } };
      const apply = (theme) => {
        const el = document.documentElement;
        if (theme === "white" || theme === "dark") el.setAttribute(ATTR, theme);
        else el.removeAttribute(ATTR);
      };
      const parentTheme = () => {
        if (!embedded()) return null;
        try {
          const raw = window.parent.document.documentElement.getAttribute(ATTR);
          if (raw === "white" || raw === "dark") return raw;
          return "light";
        } catch (_) { return null; }
      };
      const systemTheme = () => {
        try { return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; } catch (_) { return "light"; }
      };
      const sync = () => apply(parentTheme() || systemTheme());
      sync();
      /* 启动主题 watcher：嵌入时观察父页主题变化，独立打开时监听系统深浅色切换。 */
      window.__cursorThemeSync = () => {
        sync();
        if (!embedded()) {
          try {
            const mq = window.matchMedia("(prefers-color-scheme: dark)");
            const onSystemChange = () => sync();
            if (mq.addEventListener) mq.addEventListener("change", onSystemChange);
            else if (mq.addListener) mq.addListener(onSystemChange);
          } catch (_) { /* ignore */ }
          return;
        }
        try {
          const onParentChange = () => sync();
          new MutationObserver(onParentChange).observe(window.parent.document.documentElement, { attributes: true, attributeFilter: [ATTR] });
          const onStorageChange = (event) => { if (event.key === "cli-proxy-theme") sync(); };
          window.addEventListener("storage", onStorageChange);
        } catch (_) { /* ignore */ }
      };
    })();
  </script>
</head>
<body>
  <main>
    <header class="header">
      <div class="header-row">
        <div class="header-title">
          <img class="header-logo" src="https://raw.githubusercontent.com/luode0320/cpa-workbuddy-plugin/main/assets/icons/Cursor.png" alt="Cursor Logo">
          <h1 data-i18n="pageTitle">Cursor 管理</h1>
        </div>
        <div class="language-field">
          <label for="language" data-i18n="languageLabel">语言</label>
          <select id="language">
            <option value="zh-CN">中文</option>
            <option value="en">English</option>
          </select>
        </div>
      </div>
      <p class="muted"><span data-i18n="headerPrefix">由 Cursor 插件直接提供，不依赖</span> <span class="nowrap">CPA Manager Plus</span> <span data-i18n="headerJoin">或</span> <span class="nowrap">CLIProxyAPI</span> <span data-i18n="headerSuffix">前端改造。</span></p>
    </header>
    <section class="panel" aria-labelledby="credential-title">
      <div class="credential-grid" id="authBox" style="display:none">
        <div>
          <label id="credential-title" for="management-key"><span class="nowrap">CLIProxyAPI</span> <span data-i18n="managementKeyLabel">管理密钥</span></label>
          <input id="management-key" type="password" autocomplete="off" spellcheck="false" aria-describedby="key-help">
          <p id="key-help" class="muted" data-i18n="keyHelp">未自动获取到管理密钥，请手动输入；密钥仅保留在当前标签页会话。</p>
        </div>
        <div class="load-action"><button id="load" class="primary" type="button" data-i18n="loadStatus">加载状态</button></div>
      </div>
      <div class="bar">
        <button id="importBtn" class="secondary" type="button" data-i18n="importCredential">导入 Token</button>
        <button id="exportBtn" class="secondary" type="button" data-i18n="exportCredential">导出凭证</button>
        <button id="enableAllBtn" class="secondary" type="button" data-i18n="enableAll">全部启用</button>
        <button id="disableAllBtn" class="secondary" type="button" data-i18n="disableAllAccounts">全部禁用</button>
      </div>
      <div id="notice" class="notice" role="status" aria-live="polite"></div>
    </section>
    <div id="accounts" class="stack" aria-live="polite"></div>
  </main>
  <div class="modal-mask" id="importModal" onclick="onImportMaskClick(event)">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="importModalTitle">
      <div class="modal-hd">
        <h2 id="importModalTitle" data-i18n="importModalTitle">导入 Cursor Token</h2>
        <button type="button" class="modal-x" onclick="closeImportModal()" aria-label="关闭">×</button>
      </div>
      <div class="modal-bd">
        <p class="hint" data-i18n="importHint">粘贴 Cursor 会话 Token（形如 user_&lt;id&gt;::&lt;jwt&gt; 或 WorkosCursorSessionToken=...），一行一个。</p>
        <textarea id="importRaw" rows="6" data-i18n-placeholder="importPlaceholder" placeholder="粘贴 Cursor 会话 Token"></textarea>
      </div>
      <div class="modal-ft">
        <button type="button" class="secondary" onclick="closeImportModal()" data-i18n="cancel">取消</button>
        <button type="button" class="primary" id="importConfirmBtn" onclick="importAuth(this)" data-i18n="importConfirm">导入并保存</button>
      </div>
    </div>
  </div>
  <div class="modal-mask" id="deleteModal" onclick="onDeleteMaskClick(event)">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle">
      <div class="modal-hd">
        <h2 id="deleteModalTitle" data-i18n="deleteModalTitle">删除账号</h2>
        <button type="button" class="modal-x" onclick="closeDeleteModal()" aria-label="关闭">×</button>
      </div>
      <div class="modal-bd">
        <p class="hint" id="deleteModalHint" data-i18n="deleteModalHint">确定要删除该账号吗？</p>
        <p class="hint" style="color:var(--danger)" data-i18n="deleteModalWarn">此操作会永久删除该账号及其认证文件，且不可恢复。</p>
      </div>
      <div class="modal-ft">
        <button type="button" class="secondary" onclick="closeDeleteModal()" data-i18n="cancel">取消</button>
        <button type="button" class="primary" id="deleteConfirmBtn" onclick="confirmDeleteAuth(this)" data-i18n="deleteConfirm">删除</button>
      </div>
    </div>
  </div>
  <div class="modal-mask" id="testModal" onclick="onTestMaskClick(event)">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="testModalTitle">
      <div class="modal-hd">
        <h2 id="testModalTitle" data-i18n="testModalTitle">测试模型</h2>
        <button type="button" class="modal-x" onclick="closeTestModal()" aria-label="关闭">×</button>
      </div>
      <div class="modal-bd">
        <p class="hint" id="testModalHint">选择要测试的模型</p>
        <div class="model-list" id="testModelList"><div class="muted">加载模型中…</div></div>
        <div class="import-result" id="testResult"></div>
      </div>
      <div class="modal-ft">
        <button type="button" class="secondary" onclick="closeTestModal()" data-i18n="close">关闭</button>
      </div>
    </div>
  </div>
  <div class="toasts" id="toasts"></div>
  <script>
    (() => {
      "use strict";
      const API = "/v0/management/plugins/cursor-provider";
      const statusPath = API + "/status";
      const disabledPath = API + "/disabled-models";
      const importPath = API + "/import";
      const exportPath = API + "/export";
      const deletePath = API + "/delete";
      const enablePath = API + "/enable";
      const disablePath = API + "/disable";
      const languageStorageKey = "cursor-plugin-language";
      /* ---------- management key acquisition (3 fallbacks, zero config) ----------
         1) 主面板 localStorage "cli-proxy-auth"（同源 iframe 内嵌时的 XOR+base64 存储）；
         2) ?key= URL 参数（读取后立即从 history 清除，落 sessionStorage）；
         3) 手动输入（仅 sessionStorage）。
      */
      const ENC_PREFIX = "enc::v1::";
      const SECRET_SALT = "cli-proxy-api-webui::secure-storage";
      const PANEL_STORE = "cli-proxy-auth";
      const SS_KEY = "cursor-mgmt-key";
      function _enc(t) { return new TextEncoder().encode(t); }
      function _dec(b) { return new TextDecoder().decode(b); }
      function _keyBytes() { try { return _enc(SECRET_SALT + "|" + window.location.host + "|" + navigator.userAgent); } catch (_) { return _enc(SECRET_SALT); } }
      function _xor(d, k) { const r = new Uint8Array(d.length); for (let i = 0; i < d.length; i++) r[i] = d[i] ^ k[i % k.length]; return r; }
      function _b64d(s) { const bin = atob(s); const b = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return b; }
      function deobfuscate(p) { if (!p || !p.startsWith(ENC_PREFIX)) return p; try { return _dec(_xor(_b64d(p.slice(ENC_PREFIX.length)), _keyBytes())); } catch (_) { return p; } }
      function isEmbedded() { try { return window.self !== window.top; } catch (_) { return false; } }
      function readPanelKey() {
        if (!isEmbedded()) return null;
        let raw;
        try { raw = localStorage.getItem(PANEL_STORE); } catch (_) { return null; }
        if (!raw) return null;
        try {
          const parsed = JSON.parse(deobfuscate(raw));
          const state = (parsed && parsed.state) || parsed || {};
          return typeof state.managementKey === "string" && state.managementKey ? state.managementKey : null;
        } catch (_) { return null; }
      }
      function readUrlKey() {
        const value = new URLSearchParams(window.location.search).get("key");
        if (value) {
          try {
            const url = new URL(window.location.href);
            url.searchParams.delete("key");
            history.replaceState(null, "", url.pathname + url.search + url.hash);
          } catch (_) { /* history 不可用时忽略，key 已落 sessionStorage */ }
        }
        return value;
      }
      function persistKey(value) {
        if (!value) return value;
        try { sessionStorage.setItem(SS_KEY, value); } catch (_) { /* ignore */ }
        return value;
      }
      function getKey() {
        let stored = null;
        try { stored = sessionStorage.getItem(SS_KEY); } catch (_) { /* ignore */ }
        return stored || persistKey(readPanelKey()) || persistKey(readUrlKey());
      }
      function authHeaders() {
        const key = getKey();
        return key ? { Authorization: "Bearer " + key } : {};
      }

      function normalizeLanguage(language) {

      function initialLanguage() {
        try {
          const saved = localStorage.getItem(languageStorageKey);
          if (saved === "zh-CN" || saved === "en") return saved;
        } catch (_) {
          // Browser privacy settings may disable storage; language detection still works.
        }
        const browserLanguages = navigator.languages?.length ? navigator.languages : [navigator.language];
        return browserLanguages.some((language) => String(language).toLowerCase().startsWith("zh")) ? "zh-CN" : "en";

      function translate(key, values = {}) {
        let message = translations[currentLanguage][key];
        for (const [name, value] of Object.entries(values)) {

        return message;

      function preserveModelSelections() {
        if (!loadedAccounts) return;

        for (const form of accounts.querySelectorAll("form[data-auth-index]")) {
          selections.set(form.dataset.authIndex, new Set(
            [...form.querySelectorAll("input[type=checkbox]:checked")].map((input) => input.value)
          ));
        }
        for (const account of loadedAccounts) {
          const selected = selections.get(account.auth_index);
          if (!selected) continue;
          for (const model of account.models) model.disabled = selected.has(model.id);
        }
      }

        const item = document.createElement("div");
        item.className = "toast " + kind;
        const head = document.createElement("div");
        head.className = "t";
        head.textContent = title;
        item.append(head);
        if (detail) {
          const body = document.createElement("div");
          body.className = "d";
          body.textContent = detail;
          item.append(body);
        }
        toasts.append(item);
        requestAnimationFrame(() => requestAnimationFrame(() => item.classList.add("show")));
        const kill = () => { item.classList.remove("show"); setTimeout(() => item.remove(), 300); };
        item.addEventListener("click", kill);
        setTimeout(kill, kind === "err" ? 6000 : 4000);
        while (toasts.children.length > 5) toasts.firstChild.remove();
      }

      async function importAuth(button) {
        const raw = (document.querySelector("#importRaw").value || "").trim();
        if (!raw) { toast(translate("importEmpty"), "warn"); return; }
        busy(button, true);
        const lines = raw.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
        let ok = 0; let dup = 0; const errors = [];
        for (let index = 0; index < lines.length; index++) {
          if (lines.length > 1) button.innerHTML = '<span class="spin"></span>' + (index + 1) + "/" + lines.length;
          try {
            const data = await api(importPath, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ content: lines[index] })
            });
            if (data && data.duplicate) dup += 1;
            else if (data && data.ok) ok += 1;
            else errors.push((data && data.message) || translate("importFailed"));
          } catch (error) {
            errors.push(error instanceof Error ? error.message : String(error));
          }
        }
        busy(button, false);
        if (errors.length) {
          toast(translate("importFailed"), "err", errors.slice(0, 2).join("；"));
        } else {
          const detail = [ok ? ok + " ok" : "", dup ? dup + " dup" : ""].filter(Boolean).join(" / ");
          toast(translate("importSuccess"), "ok", detail || translate("importDuplicate"));
          document.querySelector("#importRaw").value = "";
          closeImportModal();
          await loadStatus();
        }
      }

          const accounts = (data && data.accounts) || [];
          if (!accounts.length) { toast(translate("exportEmpty"), "warn"); return; }
          const stamp = new Date().toISOString().slice(0, 10);
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "cursor-credentials-" + stamp + ".json";
          document.body.append(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          toast(translate("exportSuccess", { count: accounts.length }), "ok");
        } catch (error) {
          toast(translate("exportFailed"), "err", error instanceof Error ? error.message : String(error));
        } finally {
          busy(button, false);

        try {
          const path = disable ? disablePath : enablePath;
          await api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ auth_index: authIndex }) });
          toast(disable ? translate("disableSuccess") : translate("enableSuccess"), "ok");
          await loadStatus();
        } catch (error) {
          toast(translate("toggleFailed"), "err", error instanceof Error ? error.message : String(error));
        } finally {
          busy(button, false);
        }
      }

      async function toggleAll(disable, button) {
        busy(button, true);
        try {
          const path = disable ? disablePath : enablePath;
          const data = await api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({}) });
          const count = (data && data.count) || 0;
          toast(translate(disable ? "disableAllSuccess" : "enableAllSuccess", { count }), "ok");
          await loadStatus();
        } catch (error) {
          toast(translate("toggleFailed"), "err", error instanceof Error ? error.message : String(error));
        } finally {
          busy(button, false);
        }
      }

      async function api(path, options = {}) {
        const key = getKey() || keyInput.value.trim();
        if (!key) {
          showAuth();
          throw new Error(translate("missingKey"));
        }
        const headers = { Authorization: `Bearer ${key}`, ...(options.headers || {}) };
        const response = await fetch(path, { ...options, headers, cache: "no-store" });
        const payload = await response.json().catch(() => ({}));
        // 密钥失效时重新显示输入区，允许用户修正密钥后重试。
        if (response.status === 401 || response.status === 403) {
          showAuth();
          throw new Error(translate("authenticationFailed"));
        }
        if (!response.ok) throw new Error((payload && payload.error) ? payload.error : translate("requestFailed", { status: response.status }));
        return payload;
      }

      function metric(label, value) {
        const item = document.createElement("div");
        item.className = "metric";
        const name = document.createElement("span");
        name.textContent = label;
        const number = document.createElement("strong");
        number.textContent = String(value);
        item.append(name, number);
        return item;
      }

      function modelID(id) {
        const code = document.createElement("code");
        for (const part of id.split(/([/_-])/)) {
          if (!part) continue;
          code.append(document.createTextNode(part));
          if (/^[/_-]$/.test(part)) code.append(document.createElement("wbr"));
        }
        return code;
      }

      function normalizedStatus(status) {
        const rawStatus = String(status || "unknown").toLowerCase();
        return rawStatus.startsWith("unavailable") ? "unavailable" : rawStatus;
      }

      function statusLabel(status) {
        const normalized = normalizedStatus(status);
        return translations[currentLanguage][`status_${normalized}`] || status || translate("status_unknown");
      }

      function renderAccount(account) {
        const card = document.createElement("section");
        card.className = "panel account";
        const head = document.createElement("div");
        head.className = "account-head";
        const titleWrap = document.createElement("div");
        const title = document.createElement("h2");
        title.textContent = account.label || account.name;
        const subtitle = document.createElement("p");
        subtitle.className = "muted";
        subtitle.textContent = account.name;
        titleWrap.append(title, subtitle);
        const pill = document.createElement("span");
        pill.className = "pill";
        pill.dataset.status = normalizedStatus(account.status);
        pill.textContent = statusLabel(account.status);
        const headActions = document.createElement("span");
        headActions.style.display = "flex";
        headActions.style.gap = "var(--space-2)";
        headActions.style.alignItems = "center";
        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "card-del";
        deleteButton.dataset.action = "delete";
        deleteButton.dataset.authIndex = account.auth_index;
        deleteButton.setAttribute("aria-label", translate("deleteConfirm"));
        deleteButton.textContent = "×";
        headActions.append(pill, deleteButton);
        head.append(titleWrap, headActions);

        const metrics = document.createElement("div");
        metrics.className = "metrics";
        metrics.append(
          metric(translate("quotaBalance"), translate("unavailable")),
          metric(translate("localEstimatedTokens"), account.local_usage?.total_tokens || 0),
          metric(translate("pluginExecutorRuns"), account.local_usage?.executor_runs || 0),
          metric(translate("cachedTokens"), translate("unknown")),
          metric(translate("successfulRequests"), account.local_usage?.succeeded || 0),
          metric(translate("failedRequests"), account.local_usage?.failed || 0)
        );
        const logicalHelp = document.createElement("p");
        logicalHelp.className = "muted";
        logicalHelp.textContent = translate("logicalRequestsHelp");

        const runtime = account.host_runtime || {};
        const hostMetrics = document.createElement("section");
        hostMetrics.className = "metric-section";
        const hostTitle = document.createElement("h3");
        hostTitle.textContent = translate("hostSchedulerMetrics");
        const hostHelp = document.createElement("p");
        hostHelp.className = "muted";
        hostHelp.textContent = translate("hostSchedulerMetricsHelp");
        const hostGrid = document.createElement("div");
        hostGrid.className = "metrics";
        hostGrid.append(
          metric(translate("hostSchedulerStatus"), statusLabel(runtime.status)),
          metric(translate("hostSuccessfulAttempts"), account.host_runtime?.success_attempts || 0),
          metric(translate("hostFailedAttempts"), account.host_runtime?.failed_attempts || 0)
        );
        hostMetrics.append(hostTitle, hostHelp, hostGrid);

        const checkpoint = account.checkpoint_metrics || {};
        const checkpointMetrics = document.createElement("section");
        checkpointMetrics.className = "metric-section";
        const checkpointTitle = document.createElement("h3");
        checkpointTitle.textContent = translate("checkpointMetrics");
        const checkpointHelp = document.createElement("p");
        checkpointHelp.className = "muted";
        checkpointHelp.textContent = translate("checkpointMetricsHelp");
        const checkpointGrid = document.createElement("div");
        checkpointGrid.className = "metrics";
        checkpointGrid.append(
          metric(translate("checkpointHits"), checkpoint.hits || 0),
          metric(translate("checkpointMisses"), checkpoint.misses || 0),
          metric(translate("checkpointInvalidations"), checkpoint.invalidations || 0),
          metric(translate("checkpointFallbacks"), checkpoint.fallbacks || 0),
          metric(translate("fullReplayBytes"), checkpoint.full_replay_bytes || 0),
          metric(translate("suffixBytes"), checkpoint.suffix_bytes || 0),
          metric(translate("averageTTFT"), checkpoint.ttft_average_ms == null ? translate("unknown") : `${checkpoint.ttft_average_ms} ms`)
        );
        checkpointMetrics.append(checkpointTitle, checkpointHelp, checkpointGrid);

        const form = document.createElement("form");
        form.dataset.authIndex = account.auth_index;
        const accountNotice = document.createElement("div");
        accountNotice.className = "notice account-notice";
        accountNotice.setAttribute("role", "status");
        accountNotice.setAttribute("aria-live", "polite");
        function setAccountNoticeKey(key, values = {}, kind = "") {
          accountNotice.textContent = translate(key, values);
          accountNotice.className = `notice account-notice ${kind}`.trim();
          accountNotice.setAttribute("role", kind === "error" ? "alert" : "status");
        }
        function setAccountNoticeLiteral(message, kind = "") {
          accountNotice.textContent = message;
          accountNotice.className = `notice account-notice ${kind}`.trim();
          accountNotice.setAttribute("role", kind === "error" ? "alert" : "status");
        }
        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const button = form.querySelector('button[type="submit"]');
          button.disabled = true;
          setAccountNoticeKey("savingSettings");
          const selected = [...form.querySelectorAll("input[type=checkbox]:checked")].map((input) => input.value);
          try {
            await api(disabledPath, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ auth_index: account.auth_index, disabled_models: selected })
            });
            const noticeKey = countKey("savedSettingsOne", "savedSettingsMany", selected.length);
            setAccountNoticeKey(noticeKey, { count: selected.length }, "success");
          } catch (error) {
            setAccountNoticeLiteral(error instanceof Error ? error.message : translate("unexpectedError"), "error");
          } finally {
            button.disabled = false;
          }
        });
        const fieldset = document.createElement("fieldset");
        const legend = document.createElement("legend");
        const legendKey = countKey("modelLegendOne", "modelLegendMany", account.models.length);
        legend.textContent = translate(legendKey, { count: account.models.length });
        const modelGrid = document.createElement("div");
        modelGrid.className = "models";
        for (const model of account.models) {
          const label = document.createElement("label");
          label.className = "model";
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.value = model.id;
          checkbox.checked = Boolean(model.disabled);
          label.append(checkbox, modelID(model.id));
          modelGrid.append(label);
        }
        const actions = document.createElement("div");
        actions.className = "actions";
        const disableAll = document.createElement("button");
        disableAll.className = "secondary";
        disableAll.type = "button";
        disableAll.dataset.action = "disable-all";
        disableAll.textContent = translate("disableAll");
        disableAll.disabled = account.models.length === 0;
        disableAll.addEventListener("click", () => {
          for (const checkbox of modelGrid.querySelectorAll('input[type="checkbox"]')) {
            checkbox.checked = true;
          }
          const noticeKey = countKey("allModelsSelectedOne", "allModelsSelectedMany", account.models.length);
          setAccountNoticeKey(noticeKey, { count: account.models.length });
        });
        const save = document.createElement("button");
        save.className = "primary";
        save.type = "submit";
        save.dataset.action = "save-settings";
        save.textContent = translate("saveSettings");
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "secondary";
        toggle.dataset.action = "toggle-account";
        toggle.dataset.authIndex = account.auth_index;
        const disabled = ["disabled", "inactive"].includes(normalizedStatus(account.status));
        toggle.textContent = disabled ? translate("enableAccount") : translate("disableAccount");
        toggle.dataset.disable = disabled ? "false" : "true";
        const testBtn = document.createElement("button");
        testBtn.type = "button";
        testBtn.className = "secondary";
        testBtn.dataset.action = "test";
        testBtn.dataset.authIndex = account.auth_index;
        testBtn.textContent = translate("testActive");
        testBtn.addEventListener("click", () => openTestModal(account.auth_index));
        actions.append(testBtn, save, disableAll, toggle);
        fieldset.append(legend, modelGrid);
        form.append(fieldset, accountNotice, actions);
        card.append(head, metrics, logicalHelp, hostMetrics, checkpointMetrics, form);
        return card;
      }

      function renderAccounts() {
        accounts.replaceChildren();
        if (loadedAccounts === null) return;
        if (!loadedAccounts.length) {
          const empty = document.createElement("section");
          empty.className = "panel empty";
          empty.textContent = translate("noAuthFiles");
          accounts.append(empty);
          return;
        }
        accounts.append(...loadedAccounts.map(renderAccount));
      }

      async function loadStatus() {
        loadButton.disabled = true;
        setNoticeKey("readingStatus");
        accounts.replaceChildren();
        try {
          const status = await api(statusPath);
          loadedAccounts = status.accounts;
          renderAccounts();
          const noticeKey = countKey("loadedAccountsOne", "loadedAccountsMany", status.accounts.length);
          setNoticeKey(noticeKey, { count: status.accounts.length }, "success");
        } catch (error) {
          setNoticeLiteral(error instanceof Error ? error.message : translate("unexpectedError"), "error");
        } finally {
          loadButton.disabled = false;
        }
      }

      languageSelect.addEventListener("change", () => applyLanguage(languageSelect.value, true));
      loadButton.addEventListener("click", () => saveKey());
      keyInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") saveKey();
      });
      importButton.addEventListener("click", openImportModal);
      exportButton.addEventListener("click", () => exportAuth(exportButton));
      enableAllButton.addEventListener("click", () => toggleAll(false, enableAllButton));
      disableAllButton.addEventListener("click", () => toggleAll(true, disableAllButton));
      function bindCardActions(root) {
        root.addEventListener("click", (event) => {
          const trigger = event.target.closest("[data-action]");
          if (!trigger) return;
          const action = trigger.dataset.action;
          if (action === "delete") {
            openDeleteModal(trigger.dataset.authIndex || "", "");
          } else if (action === "test") {
            openTestModal(trigger.dataset.authIndex || "");
          } else if (action === "toggle-account") {
            toggleAccount(trigger.dataset.authIndex || "", trigger.dataset.disable === "true", trigger);
          }
        });
      }
      bindCardActions(accounts);
      applyLanguage(currentLanguage, false);
      // 启动主题同步 watcher（嵌入父面板 MutationObserver + 独立时跟随系统主题）。
      if (window.__cursorThemeSync) window.__cursorThemeSync();
      // 免密直入：已有密钥时直接加载状态；无密钥才显示输入区。
      if (getKey()) {
        loadStatus();
      } else {
        showAuth();
      }
    })();
  </script>
</body>
</html>
