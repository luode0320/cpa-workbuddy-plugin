<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Copilot 面板</title>
<style>
/* Theme tokens aligned with CPA management panel (key-policy / themes.scss):
   default :root = light (paper); data-theme=white | dark; embedded iframe syncs parent. */
:root{
  --bg:#faf9f5;--card:#ffffff;--border:#e3e1db;--fg:#2d2a26;--mut:#6d6760;
  --acc:#4c8dff;--on-acc:#ffffff;--ok:#10b981;--warn:#e0aa14;--err:#c65746;
  --surface:#f0eee8;--btn-sec:#eef1f6;--btn-sec-hover:#e4e8ef;
  --input-bg:#ffffff;--placeholder:rgba(109,103,96,.55);
  --ok-soft:rgba(16,185,129,.10);--ok-border:rgba(16,185,129,.30);
  --warn-soft:rgba(224,170,20,.12);--warn-border:rgba(224,170,20,.32);
  --err-soft:rgba(198,87,70,.10);--err-border:rgba(198,87,70,.30);
  --scrim:rgba(45,42,38,.35);--modal-shadow:0 24px 56px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.04);
  --acc-ring:rgba(76,141,255,.18);--radius-md:12px;--radius-lg:16px;
  color-scheme:light
}
:root[data-theme="white"]{
  --bg:#f5f5f5;--card:#ffffff;--border:#e6e6e6;--fg:#1f1f1f;--mut:#707070;
  --surface:#fafafa;--btn-sec:#f0f0f0;--btn-sec-hover:#e8e8e8;
  --input-bg:#ffffff;--placeholder:rgba(112,112,112,.55);
  --scrim:rgba(0,0,0,.32);--modal-shadow:0 24px 56px rgba(0,0,0,.16),0 0 0 1px rgba(0,0,0,.04);
  color-scheme:light
}
:root[data-theme="dark"]{
  --bg:#1e1d1b;--card:#26241f;--border:#3a3833;--fg:#ede9e3;--mut:#9a948c;
  --acc:#4c8dff;--on-acc:#ffffff;--ok:#34d399;--warn:#f0c050;--err:#e07a6a;
  --surface:#2f2d28;--btn-sec:#35332e;--btn-sec-hover:#3f3c36;
  --input-bg:#1e1d1b;--placeholder:rgba(154,148,140,.55);
  --ok-soft:rgba(52,211,153,.12);--ok-border:rgba(52,211,153,.38);
  --warn-soft:rgba(240,192,80,.14);--warn-border:rgba(240,192,80,.38);
  --err-soft:rgba(224,122,106,.12);--err-border:rgba(224,122,106,.38);
  --scrim:rgba(0,0,0,.55);--modal-shadow:0 24px 56px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.04);
  --acc-ring:rgba(76,141,255,.28);
  color-scheme:dark
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:24px 20px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);font-size:13px;margin-bottom:20px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
button{background:var(--acc);color:var(--on-acc);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px}
button.sec{background:var(--btn-sec);color:var(--fg)}
button.sec:hover{background:var(--btn-sec-hover)}
button:disabled{opacity:.5;cursor:default}
.bar .search{max-width:210px;flex:0 1 210px;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--fg);font-size:13px;outline:none}
.bar .search:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-ring)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px}
.card h2{font-size:14px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .row{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin:4px 0;gap:8px}
.card .row .v{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.card .acts button{padding:5px 10px;font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;border:1px solid transparent;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-border)}
.b-warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-border)}
.b-err{background:var(--err-soft);color:var(--err);border-color:var(--err-border)}
.pb{margin-top:10px}
.pb-item{margin:6px 0}
.pb-head{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-bottom:3px}
.pb-track{height:6px;background:var(--surface);border-radius:3px;overflow:hidden}
.pb-fill{height:100%;background:var(--ok);border-radius:3px;transition:width .3s}
.pb-fill.warn{background:var(--warn)}
.pb-fill.err{background:var(--err)}
.empty{color:var(--mut);text-align:center;padding:40px;font-size:13px}
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--acc);border-radius:8px;padding:10px 14px;box-shadow:var(--modal-shadow);opacity:0;transform:translateY(8px);transition:all .2s;max-width:320px;cursor:pointer}
.toast.show{opacity:1;transform:none}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--err)}
.toast .t{font-size:13px;font-weight:500}
.toast .d{font-size:12px;color:var(--mut);margin-top:3px;word-break:break-all}
.mask{position:fixed;inset:0;background:var(--scrim);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.mask.on{display:flex}
.modal{background:var(--card);border-radius:var(--radius-lg);padding:22px;max-width:520px;width:100%;box-shadow:var(--modal-shadow);max-height:86vh;overflow:auto}
.modal h3{margin:0 0 12px;font-size:16px}
.modal textarea{width:100%;min-height:140px;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--fg);font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;outline:none;resize:vertical}
.modal textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-ring)}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.code{font:16px/1.6 ui-monospace,Menlo,Consolas,monospace;background:var(--surface);border-radius:8px;padding:12px;text-align:center;letter-spacing:2px;font-weight:600;margin:10px 0}
.hint{font-size:12px;color:var(--mut);line-height:1.7}
.hint a{color:var(--acc)}
.model-list{display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow:auto;padding:2px}
.model-list button{padding:5px 10px;font-size:12px;background:var(--btn-sec);color:var(--fg)}
.model-list button:hover{background:var(--btn-sec-hover)}
.test-result{margin-top:12px}
.test-result .r-hd{font-size:13px;font-weight:600;margin-bottom:4px}
.test-result .r-hd.ok{color:var(--ok)}
.test-result .r-hd.err{color:var(--err)}
.test-result .r-item{font-size:12px;color:var(--mut);word-break:break-all}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:5px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>GitHub Copilot Provider</h1>
  <div class="sub">GitHub 账号 OAuth 设备码授权 · 多账号池 · 额度查询 · 模型发现</div>

  <div class="bar">
    <button id="btnLogin">＋ 添加账号（GitHub 授权）</button>
    <button class="sec" id="btnImport">导入 Token</button>
    <button class="sec" id="btnRefresh">刷新</button>
    <input class="search" id="search" placeholder="搜索账号 / 用户">
    <button class="sec" id="btnEnableAll">全部启用</button>
    <button class="sec" id="btnDisableAll">全部禁用</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">暂无账号，点击「＋ 添加账号」通过 GitHub 授权接入</div>
</div>

<div class="mask" id="loginMask">
  <div class="modal">
    <h3>GitHub 授权登录</h3>
    <div id="loginBody" class="hint">正在申请设备码…</div>
    <div class="foot"><button class="sec" id="loginCancel">取消</button></div>
  </div>
</div>

<div class="mask" id="importMask">
  <div class="modal">
    <h3>导入 GitHub Token</h3>
    <div class="hint" style="margin-bottom:10px">
      每行一个 GitHub Personal Access Token，可用 <code>token----备注</code> 指定备注名；
      也可直接粘贴 JSON 数组 <code>[{"token":"...","label":"..."}]</code>。
    </div>
    <textarea id="importText" placeholder="ghp_xxxxxxxxxxxx----我的账号"></textarea>
    <div class="foot">
      <button class="sec" id="importCancel">取消</button>
      <button id="importOk">导入</button>
    </div>
  </div>
</div>

<div class="mask" id="testMask">
  <div class="modal">
    <h3>测试模型</h3>
    <div class="hint" id="testHint" style="margin-bottom:10px">选择要测试的模型</div>
    <div id="testModelList" class="model-list"><div class="hint">加载模型中…</div></div>
    <div id="testResult" class="test-result"></div>
    <div class="foot"><button class="sec" id="testCancel">关闭</button></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<script>
const API = "/v0/management/plugins/copilot-provider";

/* ---------- management key acquisition (3 fallbacks, zero config) ----------
   1) CPA main panel localStorage "cli-proxy-auth" (XOR+base64, same-origin
      iframe embed) — same approach as cpa-plugin-key-policy.
   2) ?key= URL param (cleaned from history after read, kept in sessionStorage).
   3) Manual input (sessionStorage only, never persisted).
*/
const ENC_PREFIX = "enc::v1::";
const ENC_PREFIX_V2 = "enc::v2::";
const SECRET_SALT = "cli-proxy-api-webui::secure-storage";
const PANEL_STORE = "cli-proxy-auth";
const SS_KEY = "copilot-mgmt-key";

function _enc(t){return new TextEncoder().encode(t)}
function _dec(b){return new TextDecoder().decode(b)}
// v2 是宿主主面板 2026-10-31 起的新格式：XOR key 只含 host，不再拼 userAgent。
// v1 保留 host+UA，用于解码升级前已写入 localStorage 的旧值。
function _keyBytes(v2){try{return _enc(v2?SECRET_SALT+"|"+window.location.host:SECRET_SALT+"|"+window.location.host+"|"+navigator.userAgent)}catch(e){return _enc(SECRET_SALT)}}
function _xor(d,k){const r=new Uint8Array(d.length);for(let i=0;i<d.length;i++)r[i]=d[i]^k[i%k.length];return r}
function _b64d(s){const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b}
function deobfuscate(p){
  if(!p)return p;
  // 1. 先按 v2 解：宿主的当前格式，解不出保留原文走下一步。
  if(p.startsWith(ENC_PREFIX_V2)){try{return _dec(_xor(_b64d(p.slice(ENC_PREFIX_V2.length)),_keyBytes(true)))}catch(e){return p}}
  // 2. 再按 v1 解：兼容升级前遗留的旧值。
  if(p.startsWith(ENC_PREFIX)){try{return _dec(_xor(_b64d(p.slice(ENC_PREFIX.length)),_keyBytes(false)))}catch(e){return p}}
  return p;
}
function isEmbedded(){try{return window.self!==window.top}catch(e){return false}}

function readPanelKey(){
  if(!isEmbedded())return null;
  let raw;try{raw=localStorage.getItem(PANEL_STORE)}catch(e){return null}
  if(!raw)return null;
  try{
    const parsed=JSON.parse(deobfuscate(raw));
    const st=(parsed&&parsed.state)||parsed||{};
    return typeof st.managementKey==="string"&&st.managementKey?st.managementKey:null;
  }catch(e){return null}
}
function readUrlKey(){
  const m=new URLSearchParams(window.location.search).get("key");
  if(m){
    // 只剔除 key 参数，保留 theme 等其它 query，避免连带抹掉上下文。
    try{
      const u=new URL(window.location.href);
      u.searchParams.delete("key");
      history.replaceState(null,"",u.pathname+u.search+u.hash);
    }catch(e){ /* 历史接口不可用时忽略，key 已落 sessionStorage */ }
  }
  return m;
}
// 把解析到的 key 固化到 sessionStorage。readUrlKey() 会立刻把 key 从 URL 上抹掉，
// 而 readPanelKey() 依赖父窗口的 localStorage；若解析后不落盘，首次调用之后
// getKey() 将永远返回空 —— 表现为面板首屏正常、随后所有请求被拦断。
function persistKey(k){
  if(!k) return k;
  try{ sessionStorage.setItem(SS_KEY,k); }catch(e){}
  return k;
}
// 旧版本可能把未解密的 enc:: 密文写进 sessionStorage，它不是可用密钥。
// 不清理会让面板持续用错误 Bearer 打服务端并停在 401，且无法自愈。
function readSessionKey(){
  let v=null;try{v=sessionStorage.getItem(SS_KEY)}catch(e){return null}
  if(v&&(v.startsWith(ENC_PREFIX)||v.startsWith(ENC_PREFIX_V2))){try{sessionStorage.removeItem(SS_KEY)}catch(e){};return null}
  return v;
}
function getKey(){
  let stored=null;try{stored=readSessionKey()}catch(e){}
  return stored||persistKey(readPanelKey())||persistKey(readUrlKey());
}
function authHeaders(k){return k?{"Authorization":"Bearer "+k}:{}}
/* --------------------------------------------------------------------------- */

function toast(title, kind="ok", detail=""){
  const box=document.getElementById("toasts");
  const el=document.createElement("div");
  el.className="toast "+kind;
  el.innerHTML='<div class="t"></div>'+(detail?'<div class="d"></div>':'');
  el.querySelector(".t").textContent=title;
  if(detail)el.querySelector(".d").textContent=detail;
  box.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("show")));
  const kill=()=>{el.classList.remove("show");setTimeout(()=>el.remove(),300)};
  el.onclick=kill;
  setTimeout(kill, kind==="err"?6000:4000);
  while(box.children.length>5)box.firstChild.remove();
}
function busy(btn, on){
  if(!btn)return;
  if(on){btn.dataset.orig=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span>处理中…'}
  else{btn.disabled=false;if(btn.dataset.orig)btn.innerHTML=btn.dataset.orig}
}
function esc(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
// 统一北京时间展示：RFC3339/ISO 输入 → "YYYY-MM-DD HH:mm:ss"（Asia/Shanghai）。
function fmtCST(s){
  if(!s) return "";
  const d=new Date(s);
  if(isNaN(d.getTime())) return String(s);
  return d.toLocaleString("zh-CN",{timeZone:"Asia/Shanghai",hour12:false,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}).replaceAll("/","-");
}
function fmtNum(n){
  const v=Number(n);
  if(!isFinite(v)) return "0";
  return v.toLocaleString("en-US");
}

async function api(path, opts={}){
  const {__silent=false, ...rest}=opts;
  const k=getKey();
  if(!k){ throw new Error("需要管理密钥，请在 CPA 主面板中打开本页"); }
  const headers={...authHeaders(k.trim?k.trim():k), ...(rest.headers||{})};
  const res=await fetch(API+path, {...rest, headers, cache:"no-store"});
  if(res.status===401||res.status===403){ throw new Error("管理密钥无效或已失效"); }
  if(!res.ok){
    const payload=await res.json().catch(()=>({}));
    throw new Error((payload&&payload.error)||("请求失败 "+res.status));
  }
  return res.json().catch(()=>({}));
}

/* ---------- state + render ---------- */
let lastAccounts=[];
let currentSearch="";

function stateBadge(a){
  if(a.disabled) return '<span class="badge b-err">已禁用</span>';
  if(a.test_failed) return '<span class="badge b-warn">测试失败</span>';
  if(a.cooling_down) return '<span class="badge b-warn">冷却中</span>';
  return '<span class="badge b-ok">正常</span>';
}
// 配额进度条：按剩余/授予着色（≤30% 黄、≤10% 红）；上游返回 unlimited 时展示满格。
function quotaHTML(a){
  const q=a.quota;
  if(!q) return '';
  if(q.error) return '<div class="pb"><div class="pb-item"><div class="pb-head"><span>额度</span><span>'+esc(q.error)+'</span></div></div></div>';
  const items=[["Chat",q.chat],["补全",q.completions],["高级请求",q.premium_interactions]];
  let html='<div class="pb">';
  let shown=false;
  for(const [name,item] of items){
    if(!item) continue;
    shown=true;
    const ent=Number(item.entitlement)||0;
    const rem=Number(item.remaining)||0;
    let pct = item.unlimited ? 100 : (ent>0 ? Math.max(0,Math.min(100,Math.round(rem/ent*100))) : 0);
    let cls = pct<=10 ? 'err' : (pct<=30 ? 'warn' : '');
    const label = item.unlimited ? '无限' : ('剩 '+fmtNum(rem)+' / '+fmtNum(ent));
    html+='<div class="pb-item"><div class="pb-head"><span>'+esc(name)+'</span><span>'+esc(label)+'</span></div>'+
      '<div class="pb-track"><div class="pb-fill '+cls+'" style="width:'+pct+'%"></div></div></div>';
  }
  html+='</div>';
  return shown?html:'';
}

function card(a){
  const title=a.label||a.username||a.auth_id;
  const enableBtn = a.disabled
    ? '<button class="sec" data-action="enable" data-auth-index="'+esc(a.auth_id)+'">启用</button>'
    : '<button class="sec" data-action="disable" data-auth-index="'+esc(a.auth_id)+'">禁用</button>';
  const plan = a.quota&&a.quota.plan ? '<span class="badge b-ok">'+esc(a.quota.plan)+'</span>' : '';
  return '<div class="card">'+
    '<h2><span class="name" title="'+esc(title)+'">'+esc(title)+'</span>'+
    '<span style="display:flex;gap:6px;align-items:center;flex:none">'+plan+stateBadge(a)+
    '<button type="button" class="sec" data-action="delete" data-auth-index="'+esc(a.auth_id)+'" title="删除账号">×</button></span></h2>'+
    '<div class="row"><span>用户</span><span class="v">'+esc(a.username||a.user_id||'-')+'</span></div>'+
    '<div class="row"><span>令牌</span><span class="v">'+esc(a.api_key_masked||'-')+'</span></div>'+
    '<div class="row"><span>档位</span><span class="v">'+esc(a.account_type||'-')+'</span></div>'+
    '<div class="row"><span>令牌到期</span><span class="v">'+esc(fmtCST(a.expires_at)||'-')+'</span></div>'+
    '<div class="row"><span>模型数</span><span class="v">'+((a.models||[]).length)+'</span></div>'+
    quotaHTML(a)+
    '<div class="acts">'+
      '<button class="sec" data-action="quota" data-auth-index="'+esc(a.auth_id)+'">刷新额度</button>'+
      '<button class="sec" data-action="models" data-auth-index="'+esc(a.auth_id)+'">模型</button>'+
      '<button class="sec" data-action="test" data-auth-index="'+esc(a.auth_id)+'" title="选择模型后发起一次真实推理">测试</button>'+
      enableBtn+
    '</div></div>';
}

function render(){
  const kw=currentSearch.trim().toLowerCase();
  const list=lastAccounts.filter(a=>{
    if(!kw) return true;
    return [a.label,a.username,a.user_id,a.email,a.auth_id].some(v=>(v||"").toLowerCase().includes(kw));
  });
  document.getElementById("grid").innerHTML=list.map(card).join("");
  document.getElementById("empty").style.display=list.length?"none":"block";
}

async function loadAccounts(){
  const data=await api("/accounts",{__silent:true});
  lastAccounts=(data&&data.accounts)||[];
  render();
}

/* ---------- actions ---------- */
document.getElementById("grid").addEventListener("click",async e=>{
  const btn=e.target.closest("button[data-action]");
  if(!btn) return;
  const action=btn.dataset.action, authIndex=btn.dataset.authIndex;
  try{
    if(action==="delete"){
      if(!confirm("确认删除该账号？此操作不可撤销。")) return;
      await api("/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({auth_id:authIndex})});
      toast("已删除");await loadAccounts();return;
    }
    if(action==="enable"||action==="disable"){
      await api("/"+action,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({auth_id:authIndex})});
      toast(action==="enable"?"已启用":"已禁用");await loadAccounts();return;
    }
    if(action==="quota"){
      busy(btn,true);
      await api("/credits?auth_index="+encodeURIComponent(authIndex));
      toast("额度已刷新");await loadAccounts();return;
    }
    if(action==="models"){
      busy(btn,true);
      const d=await api("/models?auth_index="+encodeURIComponent(authIndex));
      const models=(d&&d.models)||[];
      toast("可用模型 "+models.length+" 个", "ok", models.slice(0,12).join(", "));
      return;
    }
    if(action==="test"){
      openTestModal(authIndex);
      return;
    }
  }catch(err){
    toast("操作失败","err",err.message);
  }finally{
    busy(btn,false);
  }
});

/* ---------- 测试按钮：先弹出模型小窗口，点选指定模型后再测试 ----------
   点卡片「测试」→ 打开弹窗 → GET /models 拉取该账号可用模型 → 点某个模型
   → POST /test-active {auth_index, model} 发起一次真实推理，结果就地展示。 */
let pendingTestAuthIndex="";
function openTestModal(idx){
  pendingTestAuthIndex=idx;
  const a=(lastAccounts||[]).find(x=>x.auth_id===idx||x.auth_index===idx);
  const who=a?(a.label||a.username||a.auth_id||idx):idx;
  const hint=document.getElementById("testHint");
  if(hint)hint.innerHTML='选择要测试的模型：<b>'+esc(who)+'</b>';
  const res=document.getElementById("testResult");
  if(res){res.innerHTML="";}
  const list=document.getElementById("testModelList");
  if(list)list.innerHTML='<div class="hint">加载模型中…</div>';
  document.getElementById("testMask").classList.add("on");
  loadTestModels(idx);
}
function closeTestModal(){
  pendingTestAuthIndex="";
  document.getElementById("testMask").classList.remove("on");
}
async function loadTestModels(idx){
  const list=document.getElementById("testModelList");
  if(!list)return;
  try{
    const d=await api("/models?auth_index="+encodeURIComponent(idx));
    // 用户可能已关闭弹窗或切换了账号，丢弃过期响应避免错投。
    if(pendingTestAuthIndex!==idx)return;
    const models=(d&&Array.isArray(d.models))?d.models.filter(m=>String(m||"").trim()):[];
    if(!models.length){
      list.innerHTML='<div class="hint">暂无可用模型</div>';
      return;
    }
    list.innerHTML=models.map(m=>'<button type="button" data-model="'+esc(m)+'">'+esc(m)+'</button>').join("");
  }catch(e){
    list.innerHTML='<div class="hint" style="color:var(--err)">'+esc(e.message||String(e))+'</div>';
  }
}
async function runTestModel(btn){
  const idx=pendingTestAuthIndex;
  const model=btn&&btn.dataset?btn.dataset.model:"";
  if(!idx||!model)return;
  const list=document.getElementById("testModelList");
  const buttons=list?list.querySelectorAll("button[data-model]"):[];
  if(buttons)buttons.forEach(b=>{b.disabled=true;});
  const res=document.getElementById("testResult");
  if(res){res.innerHTML='<div class="r-hd">测试中…</div>';}
  try{
    const d=await api("/test-active", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({auth_index: idx, model: model})
    });
    const ok=!(d&&d.error);
    if(res){
      res.innerHTML='<div class="r-hd '+(ok?"ok":"err")+'">'+(ok?"测试成功":"测试失败")+'</div>'+
        '<div class="r-item">'+esc(model)+' · '+esc(ok?(d.message||"活跃成功"):(d.error||"未知错误"))+'</div>';
    }
    if(ok)toast("测试成功","ok",d.message||("模型: "+model));
    else toast("测试失败","err",d.error);
  }catch(e){
    if(res){res.innerHTML='<div class="r-hd err">测试失败</div><div class="r-item">'+esc(model)+' · '+esc(e.message||String(e))+'</div>';}
    toast("测试失败","err",e.message||String(e));
  }finally{
    if(buttons)buttons.forEach(b=>{b.disabled=false;});
  }
}
document.getElementById("testModelList").addEventListener("click",e=>{
  const btn=e.target.closest("button[data-model]");
  if(btn)runTestModel(btn);
});
document.getElementById("testCancel").onclick=closeTestModal;
document.getElementById("testMask").addEventListener("click",e=>{
  if(e.target===document.getElementById("testMask"))closeTestModal();
});

/* ---------- device flow login ---------- */
let loginTimer=null;
function stopLoginPoll(){ if(loginTimer){clearInterval(loginTimer);loginTimer=null;} }
function closeLogin(){ stopLoginPoll(); document.getElementById("loginMask").classList.remove("on"); }
document.getElementById("loginCancel").onclick=closeLogin;

document.getElementById("btnLogin").onclick=async()=>{
  const mask=document.getElementById("loginMask");
  const body=document.getElementById("loginBody");
  body.innerHTML='正在申请设备码…';
  mask.classList.add("on");
  try{
    const d=await api("/login-start",{method:"POST"});
    const code=d.user_code||"";
    const url=d.verification_uri||"";
    const state=d.state||"";
    body.innerHTML='<div>请在新窗口打开 GitHub 授权页，并输入下方设备码：</div>'+
      '<div class="code">'+esc(code)+'</div>'+
      '<div class="hint">授权地址：<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(url)+'</a></div>'+
      '<div class="hint" style="margin-top:8px" id="loginStatus">等待授权中…</div>';
    window.open(url,"_blank","noopener");
    stopLoginPoll();
    loginTimer=setInterval(async()=>{
      try{
        const r=await api("/login-poll?state="+encodeURIComponent(state),{__silent:true});
        if(r.status==="success"){
          stopLoginPoll();closeLogin();
          toast("账号绑定成功");
          await loadAccounts();
        }else if(r.status==="error"){
          stopLoginPoll();
          const st=document.getElementById("loginStatus");
          if(st) st.textContent="授权失败："+(r.message||"");
          toast("授权失败","err",r.message||"");
        }
      }catch(err){ /* 静默重试，避免轮询噪声 */ }
    },3000);
  }catch(err){
    body.innerHTML='<div class="hint">申请设备码失败：'+esc(err.message)+'</div>';
  }
};

/* ---------- import ---------- */
document.getElementById("btnImport").onclick=()=>{
  document.getElementById("importText").value="";
  document.getElementById("importMask").classList.add("on");
};
document.getElementById("importCancel").onclick=()=>document.getElementById("importMask").classList.remove("on");
document.getElementById("importOk").onclick=async()=>{
  const content=document.getElementById("importText").value;
  if(!content.trim()){toast("请输入内容","err");return;}
  try{
    const d=await api("/import",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({content})});
    const r=(d&&d.result)||{};
    toast("导入完成","ok","成功 "+(r.imported||0)+" 个，跳过 "+(r.skipped||0)+" 个");
    document.getElementById("importMask").classList.remove("on");
    await loadAccounts();
  }catch(e){toast("导入失败","err",e.message);}
};

/* ---------- theme sync (embedded iframe follows parent) ---------- */
(function syncTheme(){
  function apply(t){ document.documentElement.setAttribute("data-theme", t==="dark"?"dark":(t==="white"?"white":"light")); }
  try{
    if(isEmbedded()&&window.parent){
      const pt=window.parent.document.documentElement.getAttribute("data-theme");
      if(pt) apply(pt);
      new MutationObserver(()=>{
        const t=window.parent.document.documentElement.getAttribute("data-theme");
        if(t) apply(t);
      }).observe(window.parent.document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
    }
  }catch(e){ /* 跨域或父窗口不可达时保持默认主题 */ }
})();
