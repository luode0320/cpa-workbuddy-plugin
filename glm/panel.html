<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智谱清言 Provider 面板</title>
<style>
:root{--bg:#faf9f5;--card:#fff;--border:#e3e1db;--fg:#2d2a26;--mut:#6d6760;--acc:#4c8dff;--on-acc:#fff;--ok:#10b981;--err:#c65746;--surface:#f0eee8;--input-bg:#fff;color-scheme:light}
:root[data-theme="dark"]{--bg:#1e1d1b;--card:#26241f;--border:#3a3833;--fg:#ede9e3;--mut:#9a948c;--surface:#2f2d28;--input-bg:#1e1d1b;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:24px 20px}h1{font-size:20px;margin:0 0 4px}.sub{color:var(--mut);font-size:13px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}input,textarea{width:100%;background:var(--input-bg);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
textarea{min-height:64px;resize:vertical}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
button{background:var(--acc);color:var(--on-acc);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px}button.sec{background:var(--surface);color:var(--fg)}.btn{display:inline-block;background:var(--acc);color:var(--on-acc);text-decoration:none;padding:8px 14px;border-radius:8px;font-size:13px}button:disabled{opacity:.5}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border)}th{color:var(--mut);font-weight:600}.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(16,185,129,.15);color:var(--ok)}.badge.off{background:rgba(109,103,96,.15);color:var(--mut)}
.hint{font-size:12px;color:var(--mut);line-height:1.7}.err{color:var(--err)}.ok{color:var(--ok)}
</style>
</head>
<body>
<div class="wrap">
  <h1>智谱清言 Provider</h1>
  <div class="sub">refresh_token 鉴权 · OpenAI 兼容反代 · 模型前缀 <code>glm/</code></div>

  <div class="card">
    <h2>一键授权</h2>
    <div class="hint">点下面的按钮打开授权引导页：安装一次书签后，在 chatglm.cn 页面点一下书签即可自动回调完成授权，无需手工复制令牌。</div>
    <div class="row"><a class="btn" id="authLink" href="/v0/resource/plugins/glm-provider/login" target="_blank" rel="noopener">打开授权引导页</a></div>
    <details style="margin-top:14px"><summary class="hint" style="cursor:pointer">手工粘贴 chatglm_refresh_token（兜底）</summary>
      <label for="token">chatglm_refresh_token</label>
      <textarea id="token" placeholder="F12 → Application → Local Storage → chatglm_refresh_token"></textarea>
      <label for="label">备注（可选）</label>
      <input id="label" placeholder="例如：主账号">
      <div class="row"><button id="importBtn" data-action="import">导入并校验</button><span id="importMsg" class="hint"></span></div>
    </details>
  </div>

  <div class="card">
    <h2>账号列表 <button class="sec" id="refreshBtn" data-action="refresh">刷新</button></h2>
    <table><thead><tr><th>账号</th><th>标识</th><th>过期</th><th>状态</th><th>操作</th></tr></thead><tbody id="accountsBody"><tr><td colspan="5" class="hint">加载中…</td></tr></tbody></table>
  </div>
</div>
<script>
const API = "/v0/management/plugins/glm-provider";
function post(path, body) {
  return fetch(API + path, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body || {})}).then(r => r.json());
}
function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function loadAccounts() {
  fetch(API + "/accounts").then(r => r.json()).then(env => {
    const list = (env && env.result && JSON.parse(env.result).accounts) || [];
    const body = document.getElementById("accountsBody");
    if (!list.length) { body.innerHTML = '<tr><td colspan="5" class="hint">暂无账号，请先导入 refresh_token</td></tr>'; return; }
    body.innerHTML = list.map(a => {
      const id = a.auth_id || a.auth_index;
      const badge = a.disabled ? '<span class="badge off">停用</span>' : '<span class="badge">启用</span>';
      const toggle = a.disabled ? "enable" : "disable";
      const toggleText = a.disabled ? "启用" : "禁用";
      return '<tr><td>'+esc(a.label)+'</td><td class="hint">'+esc(a.refresh_token_masked)+'</td><td class="hint">'+esc(a.expires_at)+'</td><td>'+badge+'</td><td>'+
        '<button class="sec" data-action="test" data-auth-id="'+esc(id)+'">测试</button> '+
        '<button class="sec" data-action="'+toggle+'" data-auth-id="'+esc(id)+'">'+toggleText+'</button> '+
        '<button class="sec" data-action="delete" data-auth-id="'+esc(id)+'">删除</button></td></tr>';
    }).join("");
  }).catch(e => { document.getElementById("accountsBody").innerHTML = '<tr><td colspan="5" class="err">加载失败: '+esc(e.message)+'</td></tr>'; });
}
function unwrap(env) {
  if (env && env.result) { try { return JSON.parse(env.result); } catch (e) { return env; } }
  return env || {};
}
document.addEventListener("click", function(ev) {
  const btn = ev.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.getAttribute("data-action");
  const authID = btn.getAttribute("data-auth-id");
  const msg = document.getElementById("importMsg");
  if (action === "import") {
    const token = document.getElementById("token").value.trim();
    const label = document.getElementById("label").value.trim();
    if (!token) { msg.className = "err"; msg.textContent = "请先粘贴 refresh_token"; return; }
    btn.disabled = true; msg.className = "hint"; msg.textContent = "校验中…";
    post("/import", {refresh_token: token, label: label}).then(env => {
      const r = unwrap(env);
      if (r.error) { msg.className = "err"; msg.textContent = r.error; }
      else { msg.className = "ok"; msg.textContent = "导入成功"; document.getElementById("token").value = ""; loadAccounts(); }
      btn.disabled = false;
    }).catch(e => { msg.className = "err"; msg.textContent = e.message; btn.disabled = false; });
    return;
  }
  if (action === "refresh") { loadAccounts(); return; }
  if (action === "enable" || action === "disable") {
    post("/"+action, {auth_id: authID}).then(() => loadAccounts()); return;
  }
  if (action === "delete") {
    if (!confirm("确认删除该账号?")) return;
    post("/delete", {auth_id: authID}).then(() => loadAccounts()); return;
  }
  if (action === "test") {
    btn.disabled = true; const old = btn.textContent; btn.textContent = "测试中…";
    post("/test-active", {auth_id: authID}).then(env => {
      const r = unwrap(env);
      alert(r.ok ? "测试通过: " + (r.model || "") : ("测试失败: " + (r.error || "unknown")));
      btn.disabled = false; btn.textContent = old;
    }).catch(e => { alert("测试失败: " + e.message); btn.disabled = false; btn.textContent = old; });
    return;
  }
});
</script>
<script>
loadAccounts();
</script>
</body>
</html>
